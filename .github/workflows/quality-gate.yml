# Recall gate (workstream D): fail when the stored rows stop matching the hand-typed key.
#
# Runs weekly and on demand. It reads the database and the key, calls no model, takes about a minute,
# and compares the matched count with evaluation/results/recall_baseline.json. A fall below the
# baseline fails the run, which is how a change that loses stored rows reaches a person instead of a
# report nobody re-reads.
#
# Needs repository secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY. Without them the job is skipped
# with a notice.
#
# After a change that moves the numbers deliberately, update the baseline with
#   python evaluation/quality_gate.py --update-baseline
# and commit evaluation/results/recall_baseline.json.
name: Recall gate

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Rewrite the baseline from the current numbers"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  pull_request:
    paths:
      - "src/extraction/**"
      - "evaluation/**"

concurrency:
  group: recall-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::Recall gate skipped: repository secrets are not set (see .github/workflows/quality-gate.yml)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-prod.txt

      - name: Install
        if: steps.secrets.outputs.ok == 'true'
        # The hand-typed key is an Excel file, so pandas and its reader travel with the production
        # dependencies rather than being added to them.
        run: pip install -r requirements-prod.txt pandas openpyxl

      - name: Run the recall gate
        if: steps.secrets.outputs.ok == 'true'
        run: |
          if [ "${{ inputs.update_baseline || 'false' }}" = "true" ]; then
            python evaluation/quality_gate.py --update-baseline
          else
            python evaluation/quality_gate.py
          fi

      - name: List tables whose cells have no stored row
        if: always() && steps.secrets.outputs.ok == 'true'
        run: python evaluation/table_coverage.py || true

      - name: Keep the reports
        if: always() && steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recall-reports
          path: |
            evaluation/results/quality_gate_*.md
            evaluation/results/table_coverage_*.md
          if-no-files-found: ignore
